# Stabilization mode: disable routine version-bump PRs until they can be
# reviewed in a dedicated upgrade phase. GitHub security update PRs are
# governed by repository security settings and are not blocked by this limit.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
