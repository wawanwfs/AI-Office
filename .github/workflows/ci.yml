name: CI
# Siklus 213: backend pytest was previously buta di CI; keep it mandatory.
# Security uplift: pinned Node24-based Actions and read-only workflow token.
on: [push, pull_request]

# Fork PRs and compromised dependency scripts may not write repository content.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir -r requirements-pytest.txt
      - run: python -m pip install --no-cache-dir -r requirements-preview-crypto.txt
      - run: python -m pytest backend_live backend -q

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install --no-cache-dir playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - name: Real Chromium desktop/mobile + WebGL fallback screenshots
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/wfs-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          python scripts/ci_browser_smoke.py
      - name: Save browser screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-browser-evidence
          path: artifacts/browser/
          if-no-files-found: warn
          retention-days: 14

  docker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify real Docker daemon on isolated CI host
        run: docker info >/dev/null
      - name: Pull pinned-version Python sandbox image
        run: docker pull python:3.11-alpine@sha256:bb1d70c1df30d8ee1e05214dbe82d6cdfd29833c1f47ce917f20991aca93acaa
      - name: Real sandbox isolation and cleanup tests
        run: PYTHONPATH=backend python scripts/ci_docker_sandbox_smoke.py
      - name: Save runtime security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase4-docker-runtime-proof
          path: artifacts/docker/
          if-no-files-found: warn
          retention-days: 14

  security-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir bandit==1.8.6
      - name: Medium/high severity static analysis of Phase 4 security paths
        run: |
          mkdir -p artifacts/security
          python -m compileall -q backend backend_live
          bandit -r -ll -f json -o artifacts/security/bandit.json \
            backend/master_queue.py backend/master_worker.py \
            backend/cost_ledger.py backend/project_rbac.py \
            backend/secure_control_api.py backend/sandbox_runtime.py \
            backend/code_qa.py backend/legacy_api_firewall.py \
            backend/metered_stream_provider.py backend/brief_intake.py \
            backend/preview_manager.py backend/preview_proxy.py \
            backend/billing_reconcile.py backend/preview_admission.py \
            backend/preview_admission_v2.py backend/preview_signature.py \
            backend/preview_authority.py backend/preview_snapshot.py \
            examples/fullstack-preview/ingress.py
      - name: Upload scoped static scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase4-scoped-sast
          path: artifacts/security/
          if-no-files-found: warn
          retention-days: 14

  code-qa-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Verify dedicated CI Docker daemon and pinned image
        run: |
          docker info >/dev/null
          docker pull python:3.11-alpine@sha256:bb1d70c1df30d8ee1e05214dbe82d6cdfd29833c1f47ce917f20991aca93acaa
      - name: Real code QA, two projects, rejected test and revoked lease
        run: PYTHONPATH=backend python scripts/ci_code_qa_smoke.py
      - name: Save actual code QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase5-real-code-qa
          path: artifacts/code-qa/
          if-no-files-found: warn
          retention-days: 14

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - name: Audit production npm dependencies (high/critical gate)
        run: |
          mkdir -p artifacts/security
          npm audit --omit=dev --audit-level=high --json > artifacts/security/npm-audit.json
      - run: python -m pip install --no-cache-dir pip-audit==2.9.0
      - name: Audit pinned Python dependency requirements
        run: pip-audit --requirement requirements-pytest.txt --format=json --output=artifacts/security/pip-audit.json
      - name: Audit separately pinned preview reviewer crypto
        run: pip-audit --requirement requirements-preview-crypto.txt --format=json --output=artifacts/security/preview-crypto-audit.json
      - name: Upload dependency vulnerability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase5-dependency-scans
          path: artifacts/security/*audit.json
          if-no-files-found: warn
          retention-days: 14

  preview-crypto-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Generate ephemeral SHA256 wheelhouse and prove offline install
        run: python scripts/ci_preview_offline_wheelhouse.py
      - name: Save scoped wheelhouse reproducibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase10-preview-crypto-wheelhouse
          path: artifacts/phase10-supply-chain/
          if-no-files-found: warn
          retention-days: 14

  secret-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Scan tracked files for high-confidence credential patterns
        run: python scripts/ci_secret_scan.py
      - name: Upload secret scan summary (no token contents)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase5-secret-patterns
          path: artifacts/security/secret-scan.json
          if-no-files-found: warn
          retention-days: 14

  fullstack-preview-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Build actual Vite/React preview output
        run: npx vite build --config examples/fullstack-preview/frontend/vite.config.mjs
      - name: Install authorized browser/HTTP/WS test clients
        run: |
          python -m pip install --no-cache-dir playwright==1.64.1 httpx==0.28.1 websockets==15.0.1
          python -m playwright install --with-deps chromium
      - name: Real isolated FastAPI and PostgreSQL via Docker Compose
        run: |
          set -euo pipefail
          mkdir -p artifacts/fullstack-preview
          alpha_token="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
          bravo_token="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
          cleanup() {
            WFS_PREVIEW_PROJECT_NAME=wfs-preview-alpha WFS_PREVIEW_HOST_PORT=18765 WFS_PREVIEW_TEST_TOKEN="$alpha_token" docker compose -f examples/fullstack-preview/compose.yaml logs --no-color > artifacts/fullstack-preview/alpha-compose-logs.txt 2>&1 || true
            WFS_PREVIEW_PROJECT_NAME=wfs-preview-bravo WFS_PREVIEW_HOST_PORT=18766 WFS_PREVIEW_TEST_TOKEN="$bravo_token" docker compose -f examples/fullstack-preview/compose.yaml logs --no-color > artifacts/fullstack-preview/bravo-compose-logs.txt 2>&1 || true
            WFS_PREVIEW_PROJECT_NAME=wfs-preview-alpha WFS_PREVIEW_HOST_PORT=18765 WFS_PREVIEW_TEST_TOKEN="$alpha_token" docker compose -f examples/fullstack-preview/compose.yaml down --volumes --remove-orphans || true
            WFS_PREVIEW_PROJECT_NAME=wfs-preview-bravo WFS_PREVIEW_HOST_PORT=18766 WFS_PREVIEW_TEST_TOKEN="$bravo_token" docker compose -f examples/fullstack-preview/compose.yaml down --volumes --remove-orphans || true
          }
          trap cleanup EXIT
          export WFS_PREVIEW_PROJECT_NAME=wfs-preview-alpha WFS_PREVIEW_HOST_PORT=18765 WFS_PREVIEW_TEST_TOKEN="$alpha_token"
          docker compose -f examples/fullstack-preview/compose.yaml up -d --build
          export WFS_PREVIEW_PROJECT_NAME=wfs-preview-bravo WFS_PREVIEW_HOST_PORT=18766 WFS_PREVIEW_TEST_TOKEN="$bravo_token"
          docker compose -f examples/fullstack-preview/compose.yaml up -d --build
          export WFS_PREVIEW_PROJECT_NAME=wfs-preview-alpha WFS_PREVIEW_HOST_PORT=18765 WFS_PREVIEW_TEST_TOKEN="$alpha_token"
          export WFS_PREVIEW_BASE=http://127.0.0.1:18765 WFS_PREVIEW_EVIDENCE_LABEL=alpha
          export WFS_PREVIEW_OTHER_TOKEN="$bravo_token"
          python scripts/ci_fullstack_preview.py
          export WFS_PREVIEW_PROJECT_NAME=wfs-preview-bravo WFS_PREVIEW_HOST_PORT=18766 WFS_PREVIEW_TEST_TOKEN="$bravo_token"
          export WFS_PREVIEW_BASE=http://127.0.0.1:18766 WFS_PREVIEW_EVIDENCE_LABEL=bravo
          export WFS_PREVIEW_OTHER_TOKEN="$alpha_token"
          python scripts/ci_fullstack_preview.py
      - name: Save full-stack proof and browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase5-real-fullstack-preview
          path: artifacts/fullstack-preview/
          if-no-files-found: warn
          retention-days: 14

  e2e-coding-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir -r requirements-pytest.txt
      - run: python -m pip install --no-cache-dir -r requirements-preview-crypto.txt
      - name: Authorized disposable Docker worker and pinned image
        run: |
          docker info >/dev/null
          docker pull python:3.11-alpine@sha256:bb1d70c1df30d8ee1e05214dbe82d6cdfd29833c1f47ce917f20991aca93acaa
      - name: Actual legacy engine to queue, Docker QA and signed-off artifacts
        run: PYTHONPATH=backend:backend_live python scripts/ci_e2e_coding_worker.py
      - name: Upload end-to-end coding acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase6-e2e-real-worker-qa
          path: artifacts/e2e-worker/
          if-no-files-found: warn
          retention-days: 14

  dynamic-preview-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npx vite build --config examples/fullstack-preview/frontend/vite.config.mjs
      - run: python -m pip install --no-cache-dir -r requirements-pytest.txt
      - run: python -m pip install --no-cache-dir -r requirements-preview-crypto.txt
      - name: Build trust-bound CycloneDX frontend SBOM for disposable review
        run: |
          mkdir -p artifacts/fullstack-preview
          npm sbom --sbom-format=cyclonedx --omit=dev > artifacts/fullstack-preview/sbom.cdx.json
          python -c 'import json; p=json.load(open("artifacts/fullstack-preview/sbom.cdx.json")); assert p["bomFormat"]=="CycloneDX" and p["components"]'
      - name: Real Docker Compose template-managed two-project lifecycle
        run: |
          docker info >/dev/null
          python scripts/ci_dynamic_preview_operator.py
      - name: Save actual operator lifecycle/cleanup proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase6-operator-preview-manager
          path: artifacts/phase6-preview-manager/
          if-no-files-found: warn
          retention-days: 14

  windows-native-offline-recovery:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir -r requirements-pytest.txt
      - run: python -m pip install --no-cache-dir -r requirements-preview-crypto.txt
      - name: Windows native WAL backup, restore, auth and invoice validation
        env:
          PYTHONPATH: backend
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-native | Out-Null
          python -m pytest backend/test_recovery_snapshot.py backend/test_preview_proxy.py backend/test_billing_reconcile.py backend/test_secure_control_api.py backend/test_brief_reconciliation.py backend/test_reconcile_cli.py backend/test_preview_signature.py backend/test_preview_manager.py -q --junitxml=artifacts/windows-native/pytest.xml
      - name: Upload independent Windows Python evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase7-windows-native-recovery
          path: artifacts/windows-native/
          if-no-files-found: warn
          retention-days: 14
