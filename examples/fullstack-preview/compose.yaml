# Disposable CI proof ONLY. Do NOT deploy to production or expose ports.
name: ${WFS_PREVIEW_PROJECT_NAME:-wfs-phase5-preview-demo}
services:
  db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: wfsdemo
      POSTGRES_USER: wfsdemo
      POSTGRES_PASSWORD: test-only-disposable
    # CI-only ephemeral DB. Run as postgres UID, never invoke root entrypoint
    # chmod/chown without container capabilities.
    user: "70:70"
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,uid=70,gid=70
      - /var/run/postgresql:rw,nosuid,nodev,uid=70,gid=70
      - /var/lib/postgresql/data:rw,nosuid,nodev,uid=70,gid=70,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfsdemo -d wfsdemo"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - preview-internal

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: "no"
    read_only: true
    user: "65534:65534"
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.75
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    ports:
      - "127.0.0.1:${WFS_PREVIEW_HOST_PORT:-18765}:8000"
    environment:
      DATABASE_URL: postgresql://wfsdemo:test-only-disposable@db:5432/wfsdemo
      WFS_PREVIEW_TEST_TOKEN: "${WFS_PREVIEW_TEST_TOKEN:?ephemeral token required}"
    volumes:
      - ../../artifacts/fullstack-preview/dist:/app/dist:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - preview-internal
      - preview-edge

networks:
  preview-internal:
    internal: true
  # Both bridges are internal: no default route to external IPs.
  # Host-loopback published API is separately verified in CI. This is
  # useful isolation evidence, NOT an independent host firewall or proof
  # against all Docker-daemon/network misconfigurations.
  preview-edge:
    driver: bridge
    internal: true
